<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10070c" />
    <meta
      name="description"
      content="Herz is a small creative experiment in a living, animated heart made with HTML, CSS, SVG, and JavaScript."
    />
    <title>Herz — Animated Heart Experience</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <main class="experience" aria-labelledby="page-title">
      <p class="eyebrow">A LITTLE EXPERIMENT IN MOTION</p>
      <h1 id="page-title">Herz<span aria-hidden="true">.</span></h1>
      <p class="intro">
        Something alive is taking shape.
      </p>

      <section class="heart-stage" aria-label="Heart animation preview">
        <div class="heart-placeholder" aria-hidden="true">
          <span>♡</span>
        </div>
        <p class="stage-caption" id="stage-caption">
          The heart is still finding its rhythm.
        </p>
      </section>

      <p class="footer-note">Made slowly, with a little heart.</p>
    </main>
  </body>
</html>
